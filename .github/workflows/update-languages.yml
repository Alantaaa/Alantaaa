name: Update Top Languages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    paths:
      - "scripts/update_languages.py"
      - ".github/workflows/update-languages.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate top languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USER: ${{ github.repository_owner }}
          # Ganti menjadi "owner" jika hanya ingin menghitung repo milikmu sendiri
          AFFILIATION: owner,collaborator,organization_member
        run: python3 scripts/update_languages.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-languages.svg
          git diff --cached --quiet || (git commit -m "chore: update top languages" && git push)
